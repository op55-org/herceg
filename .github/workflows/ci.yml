name: CI

on:
  push:
    branches: [main]
  pull_request:
  # Run on any branch by hand: gh workflow run ci.yml --ref <branch>
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # PDF tools for the export tests; Xvfb and Mesa's software GL for
      # Firefox's WebGL, which runner images do not always carry.
      - run: >-
          sudo apt-get update && sudo apt-get install -y qpdf mupdf-tools poppler-utils
          xvfb libgl1-mesa-dri libglx-mesa0 libegl-mesa0
      - run: npm run lint
      - run: npm run test:release
      - run: npm run test:contracts
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: npm run test:package
      # Browser tests use the Chrome preinstalled on GitHub's Ubuntu runners,
      # and Playwright's Firefox and WebKit builds. Those are cached by what
      # picks them: Playwright's version and the runner's Ubuntu release.
      - id: playwright
        run: |
          echo "version=$(node -p 'require("playwright/package.json").version')" >> "$GITHUB_OUTPUT"
          echo "os=$(. /etc/os-release && echo "$ID-$VERSION_ID")" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ steps.playwright.outputs.os }}-${{ runner.arch }}-${{ steps.playwright.outputs.version }}
      # Downloads only builds missing from the cache; the system packages
      # they need are installed every run.
      - run: npx playwright install --with-deps firefox webkit
      # Firefox has WebGL only with a display: Xvfb's, drawn by Mesa's
      # software renderer (llvmpipe), as Chrome draws with SwiftShader.
      - run: xvfb-run --auto-servernum npm run test:browser
      # The suites' reports, which the contracts job checks.
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: contracts-check
          path: tmp/contracts/
      - run: npm run bench:size

  python:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - uses: astral-sh/setup-uv@v10.3.0
        with:
          cache-dependency-glob: python/uv.lock
      - run: sudo apt-get update && sudo apt-get install -y qpdf mupdf-tools poppler-utils
      - run: npm ci
      # Installing the package for linting needs its bundled JavaScript.
      - run: npm run build:python
      - run: npm run lint:python
      - run: npm run test:python
      # Web pages through a running Flask app, in the browsers the check job
      # uses; Xvfb gives Firefox WebGL for the 3D charts, as there.
      - run: sudo apt-get install -y xvfb libgl1-mesa-dri libglx-mesa0 libegl-mesa0
      - id: playwright
        run: |
          echo "version=$(node -p 'require("playwright/package.json").version')" >> "$GITHUB_OUTPUT"
          echo "os=$(. /etc/os-release && echo "$ID-$VERSION_ID")" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ steps.playwright.outputs.os }}-${{ runner.arch }}-${{ steps.playwright.outputs.version }}
      - run: npx playwright install --with-deps firefox webkit
      - run: xvfb-run --auto-servernum npm run test:python-web
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: contracts-python
          path: tmp/contracts/
      # The built wheel must carry the JavaScript bundles and work outside the checkout.
      - run: cd python && uv build
      - run: |
          uv venv /tmp/wheel
          uv pip install --python /tmp/wheel/bin/python "$(ls python/dist/*.whl)[export]"
          cd /tmp && /tmp/wheel/bin/python -c "import herceg as hg; c = hg.line({'x': [1, 2], 'y': [3, 4]}, x='x', y='y'); assert c.to_svg().startswith('<svg') and 'hercegPython' in c.to_html()"

  # Every declared contract proved by the other jobs' runs of this commit
  # (scripts/check-contracts.mjs), and docs/capabilities.md and .json what
  # that complete run writes.
  contracts:
    needs: [check, python]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - uses: astral-sh/setup-uv@v10.3.0
        with:
          cache-dependency-glob: python/uv.lock
      - run: npm ci
      # The inventory imports the Python package, widget included.
      - run: npm run build:python
      - uses: actions/download-artifact@v8
        with:
          pattern: contracts-*
          path: tmp/contracts/
          merge-multiple: true
      - run: npm run contracts
      - run: npm run contracts:docs -- --check
